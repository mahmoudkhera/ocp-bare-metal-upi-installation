#  ---Global settings---

# This server is the official DHCP server for the network
authoritative;

# Do not update the dns records 
ddns-update-style none;

# Give addresses to clients whose MAC address isn’t listed in a host { } block. This is the default.
allow unknown-clients;

# Clients may not update DNS themselves. It only matters when DDNS is active. With none above, it has no effect.
ignore client-updates;

# This sets the default lease duration
default-lease-time 86400;        # 1 day

# This sets the maximum lease duration the DHCP server will grant to a client
max-lease-time 172800;           # 2 days
log-facility local7;

# option domain-name "ocp.internal";
# option domain-name-servers 192.168.10.2;

# Subnet definition
subnet 192.168.10.0 netmask 255.255.255.0 {
    range 192.168.10.20 192.168.10.99;      # dynamic pool
    option routers                  192.168.10.2; # lan 
    option subnet-mask 255.255.255.0;
    option domain-name              "ocp.internal";
    option domain-name-servers       192.168.10.2;
}

# Fixed addresses (reservations), matched by MAC address



host ocp-bootstrap {
 hardware ethernet BC:24:11:10:00:00;
 fixed-address 192.168.10.200;
}

host ocp-control-plane-1 {
 hardware ethernet BC:24:11:10:00:01;
 fixed-address 192.168.10.201;
}

host ocp-control-plane-2 {
 hardware ethernet BC:24:11:10:00:02;
 fixed-address 192.168.10.202;
}

host ocp-control-plane-3 {
 hardware ethernet BC:24:11:10:00:03;
 fixed-address 192.168.10.203;
}

host ocp-worker-1 {
 hardware ethernet BC:24:11:10:00:11;
 fixed-address 192.168.10.211;
}

host ocp-worker-2 {
 hardware ethernet BC:24:11:10:00:12;
 fixed-address 192.168.10.212;
}


host mirror image {
 hardware ethernet BC:24:11:10:00:12;
 fixed-address 192.168.10.2013;
}
