# ---Global settings---

global

    # The maximum number of simultaneous connections the whole HAProxy process will accept. 
    # Once it is reached, new connections wait in the kernel’s queue until others close.
    # Each connection uses memory, so this is a safety limit.
    maxconn     20000

    # where to send logs. It has three parts:
    log         /dev/log local0 info
    # After startup, HAProxy locks itself into this directory, which becomes its /.
    # It cannot see or touch the rest of the filesystem. If someone exploited a bug in HAProxy, the damage would be limited to this folder.
    chroot      /var/lib/haproxy
   
    # HAProxy starts as root, because it needs root to bind ports below 1024 (80 and 443 here), 
    # then drops to this unprivileged user and group. After that, a compromised process has no root rights.
    user        haproxy
    group       haproxy
    
    # Runs HAProxy in the background.
    daemon

    # Creates a Unix socket file that you can use to talk to the running HAProxy: view stats,
    #  see server states, or disable a server without restarting.

    # This is separate from the listen stats web page on port 9000.
    # The socket is a local command channel, and the web page is for browsers.
    stats socket /run/haproxy/admin.sock mode 660 level admin

    # Closes idle socket sessions after 30 seconds.
    stats timeout 30s



defaults
    # Reuses the log line from the global section (/dev/log local0 info),
    #  so you don’t repeat it in every frontend and backend.
    log                     global
    
    # The default protocol mode for any section that doesn’t set its own
    #    - http: layer 7. HAProxy reads and understands HTTP requests.
    #    - tcp: layer 4. HAProxy forwards raw bytes without looking inside. 
    mode                    http
    
    # Switches to the detailed HTTP log format: client IP, request line, status code, timings, bytes sent. 
    # Without it you get a very basic log line.
    option                  httplog
    
    # Skips logging connections that open and close without sending any data. These are usually health checks
    option                  dontlognull
    
    # After each response, HAProxy closes the connection to the backend server but keeps the client connection open for more requests
    option                  http-server-close
    
    # If a connection to the chosen server fails,
    # a retry may go to a different server instead of hammering the same dead one.
    # This matters with balance source, which normally ties each client IP to one server.
    option                  redispatch
    
    # Adds an X-Forwarded-For header with the client’s real IP
    option                  forwardfor except 127.0.0.0/8
    
    # How many times HAProxy retries connecting to a server after a connection failure before giving up
    retries                 3

    # The default connection limit for each frontend
    maxconn                 20000
   
    # ----Timeouts----

    # Time a client has to send a complete HTTP request. It protects against slow clients that hold connections open
    timeout http-request    10000ms
    # How long an idle keep-alive connection waits for the next request. HTTP mode only.
    timeout http-keep-alive 10000ms
    # Extra time a health check gets to answer after the connection to the server is already made.
    timeout check           10000ms
    # Maximum time to establish a connection to a backend server.
    timeout connect         40000ms
    # Maximum idle time on the client side.
    timeout client          300000ms
    # Maximum idle time on the server side.
    timeout server          300000ms
    # How long a connection waits in the queue when a server is full, before getting a 503 error.
    timeout queue           50000ms

# This block creates a small web page that shows the live status of HAProxy: 
#  which frontends and backends exist, which servers are up or down, and how much traffic each handles.

listen stats
    # Listens on TCP port 9000 on all IPv4 addresses of the machine. :9000 is the same as
    bind :9000
    # The URL path of the page. You open it at: http://    192.168.10.2:9000/stats
    stats uri /stats
    # Makes the page reload itself every 10 seconds
    stats refresh 10000ms


# The Kube API frontend and backend

# A frontend defines where HAProxy listens and where it sends what it receives.
frontend k8s_api_frontend
    # Listens on TCP port 6443 on all IPv4 addresses of the machine
    bind :6443
    # Sends every connection to the backend named k8s_api_backend.
    #  There are no ACL rules here, so everything goes to that one backend
    default_backend k8s_api_backend
    # HAProxy forwards raw bytes at layer 4 and does not look inside them.
    # This is required for the API, because the traffic is TLS with client certificates.
    # This line overrides mode http from defaults, 
    # so the HTTP-only options (httplog, forwardfor) don’t apply here
    mode tcp



# A backend defines the group of servers that do the work.

backend k8s_api_backend
    # Must match the frontend. A frontend and its backend in different modes is a config error.
    mode tcp
    # The load-balancing method. source hashes the client’s IP address, 
    # so the same client always lands on the same server
    balance source
    # Each server line has four parts:
    # server: declares a backend server.
    # ocp-bootstrap: the name shown in logs and on the stats page. It is only a label.
    #    192.168.10.200:6443: the IP and port HAProxy connects to.
    # check: turns on health checks. HAProxy tries to open a TCP connection to the server every 2 seconds by default.
    server      ocp-bootstrap   192.168.10.200:6443 check
    server      ocp-cp-1   192.168.10.201:6443 check
    server      ocp-cp-2   192.168.10.202:6443 check
    server      ocp-cp-3   192.168.10.203:6443 check


# The Machine Config Server frontend and backend
# ---
# The Machine Config Server (MCS) hands out the ignition configuration to nodes that are
# being set up. When a new node boots from the RHCOS image, it asks the MCS: “what
# should I become?” The MCS answers with the config that turns it into a control-plane node
# or a worker, including its files, services and certificates.
# During installation: the bootstrap node runs a temporary MCS, and the control-plane
# nodes fetch their config from it.
# After installation: the MCS runs on the control-plane nodes, and any node you add
# later (for example a new worker) pulls its config from there.
# ---


frontend ocp_machine_config_server_frontend
    mode tcp
    bind :22623
    default_backend machine_config_server_backend

backend machine_config_server_backend
    mode tcp
    balance source
    server      ocp-bootstrap   192.168.10.200:22623 check
    server      ocp-cp-1   192.168.10.201:22623 check
    server      ocp-cp-2   192.168.10.202:22623 check
    server      ocp-cp-3   192.168.10.203:22623 check


# The ingress frontends and backends

# ---
# What the ingress is
# Applications in OpenShift are published through routes. The OpenShift Ingress Controller
# (a router, built on HAProxy itself) runs as pods on the worker nodes and listens on ports 80
# and 443 there. It reads the HTTP Host header or the TLS SNI name and decides which
# application gets the request.

#  Note
#  Your external HAProxy does not need to understand any of that. It only has to get the
# connection to a worker running the router.
# the Ingress Controller handles layer 7.

# ---


frontend http_ingress_frontend
    bind :80
    default_backend http_ingress_backend
    mode tcp

backend http_ingress_backend
    balance source
    mode tcp
    server      ocp-w-1   192.168.10.211:80 check
    server      ocp-w-2   192.168.10.212:80 check


frontend https_ingress_frontend
    bind *:443
    default_backend https_ingress_backend
    # mode tcp: this matters most here. Application traffic is TLS, 
    # and the certificates live in the router.
    # If you used mode http, HAProxy would have to hold the certificates and decrypt the traffic itself.
    mode tcp

backend https_ingress_backend
    mode tcp
    balance source
    server      ocp-w-1   192.168.10.211:443 check
    server      ocp-w-2    192.168.10.212:443 check

