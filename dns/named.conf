//
// /etc/named.conf
// Recursive resolver + authoritative server for ocp.internal
// LAN: 192.168.10.0/24   DNS server: 192.168.10.1
//

// access control list
acl "lan" {
    localhost;
    192.168.10.0/24;
};

options {
    directory "/var/named";
    dump-file "/var/named/data/cache_dump.db";
    statistics-file "/var/named/data/named_stats.txt";
    memstatistics-file "/var/named/data/named_mem_stats.txt";

    // --- Listening ---
    listen-on port 53    { 127.0.0.1; 192.168.10.1; };
    listen-on-v6 port 53 { ::1; };

    // --- Access control ---

    // Who may send queries to this server at all?
    allow-query       { lan; };
    // Who may ask it to look up names it doesn't own?
    allow-recursion   { lan; };
    // Who may get answers from its cache?
    allow-query-cache { lan; };
    // Who may download a full copy of a zone?
    allow-transfer    { none; };

    // --- Recursion and forwarding ---

    // the server finds answers for clients.
    recursion yes;

    // This is a list of upstream DNS servers (here Google's public DNS). Instead of resolving by itself, your server asks them to do the work.
    forwarders {
        8.8.8.8;
        8.8.4.4;
    };

    // Ask the forwarders first. If they fail or don't answer, fall back to resolving on its own from the root servers.
    forward first;

    // --- DNSSEC ---

    // DNSSEC adds digital signatures to DNS records. With validation on, your server checks the signature chain from the root zone down to the domain
    dnssec-validation auto;

    // --- Hardening ---
    version none;
    hostname none;
    server-id none;

    managed-keys-directory "/var/named/dynamic";
    pid-file "/run/named/named.pid";
    session-keyfile "/run/named/session.key";
};

logging {
    channel default_log {
        file "/var/log/named/named.log" versions 3 size 10m;
        severity dynamic;
        print-time yes;
    };
    category default { default_log; };

    // Uncomment to log every client query (noisy):
    // channel query_log {
    //     file "/var/log/named/query.log" versions 3 size 20m;
    //     severity info;
    //     print-time yes;
    // };
    // category queries { query_log; };
};

// Root hints, localhost, and RFC 1918 zones (shipped with RHEL)
zone "." IN {
    type hint;
    file "named.ca";
};

include "/etc/named.rfc1912.zones";
include "/etc/named.root.key";

// Forward zone
zone "ocp.internal" IN {
    type primary;
    file "/var/named/ocp.internal.zone";
    // Who may modify zone records dynamically?
    allow-update { none; };
    notify no;
};

// Reverse zone for 192.168.10.0/24
zone "10.168.192.in-addr.arpa" IN {
    type primary;
    file "/var/named/10.168.192.in-addr.arpa.zone";
    // Who may modify zone records dynamically?
    allow-update { none; };
    notify no;
};